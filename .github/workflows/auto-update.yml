name: Auto Update AriaNg Docker Image

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest AriaNg release version
        id: ariang
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_VERSION=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mayswind/AriaNg/releases/latest | jq -r '.tag_name')
          echo "version=${LATEST_VERSION}" >> $GITHUB_OUTPUT
          echo "Latest AriaNg version: ${LATEST_VERSION}"

      - name: Check if tag exists
        id: check
        env:
          VERSION: ${{ steps.ariang.outputs.version }}
        run: |
          if git tag -l | grep -q "^${VERSION}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${VERSION} already exists, skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${VERSION} not found, will build"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.ariang.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Download AriaNg
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.ariang.outputs.version }}
        run: |
          mkdir -p ariang
          curl -fsSL "https://github.com/mayswind/AriaNg/releases/download/${VERSION}/AriaNg-${VERSION}.zip" -o ariang.zip
          unzip -q ariang.zip -d ariang
          rm ariang.zip

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ariang:${{ steps.ariang.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ariang:latest
