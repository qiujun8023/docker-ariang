name: Build AriaNg Docker Image

on:
  schedule:
    # 每天 UTC 时间 0 点检查一次
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mayswind/AriaNg/releases/latest | jq -r '.tag_name')
          CURRENT=$(cat VERSION 2>/dev/null || echo "")
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          if [ "${LATEST}" = "${CURRENT}" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date: ${LATEST}"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "New version found: ${LATEST} (current: ${CURRENT})"
          fi

      - name: Download AriaNg
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir -p ariang
          curl -fsSL "https://github.com/mayswind/AriaNg/releases/download/${VERSION}/AriaNg-${VERSION}.zip" -o ariang.zip
          unzip -q ariang.zip -d ariang
          rm ariang.zip

      - name: Set up QEMU
        if: steps.check.outputs.needed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: steps.check.outputs.needed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ariang:${{ steps.check.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ariang:latest

      - name: Commit and tag
        if: steps.check.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${VERSION}" > VERSION
          git add VERSION
          git commit -m "chore: update AriaNg to ${VERSION}"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin HEAD:master "${VERSION}"
